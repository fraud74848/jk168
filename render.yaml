services:
  - type: web
    name: employee-monitor
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      # 1. 安装 Python 依赖
      pip install -r requirements.txt

      # 1.5 安装 Node.js（关键步骤！）
      echo "📦 安装 Node.js..."
      curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      apt-get install -y nodejs
      node --version
      npm --version
      echo "✅ Node.js 安装完成"

      # 2. 构建前端
      echo "📦 安装前端依赖..."
      npm install

      echo "🔨 构建前端..."
      npm run build

      # 3. 复制构建文件到 static 目录
      echo "📋 复制到 static 目录..."
      rm -rf static
      cp -r dist static

      echo "✅ 构建完成！"
    startCommand: |
      chmod +x entrypoint.sh && ./entrypoint.sh
    envVars:
      # 数据库配置（在 Render 控制台设置实际值）
      - key: DATABASE_URL
        sync: false

      # 管理员配置
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

      # JWT 配置
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480

      # 存储配置
      - key: SCREENSHOT_DIR
        value: /data/screenshots
      - key: SCREENSHOT_FORMAT
        value: webp
      - key: SCREENSHOT_QUALITY
        value: 80
      - key: SCREENSHOT_INTERVAL
        value: 60

      # 清理配置
      - key: AUTO_CLEANUP_ENABLED
        value: true
      - key: CLEANUP_INTERVAL
        value: 21600
      - key: SCREENSHOT_RETENTION_HOURS
        value: 4

      # Aiven SSL 配置
      - key: CA_CERT_PATH
        value: /etc/ssl/certs/ca-certificates.crt

      # 调试配置
      - key: DEBUG
        value: false

    # 磁盘存储（用于截图）
    disk:
      name: screenshots
      mountPath: /data
      sizeGB: 5
