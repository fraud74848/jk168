services:
  # Web服务 - 使用Docker部署
  - type: web
    name: employee-monitor
    runtime: docker
    repo: https://github.com/你的用户名/employee-monitor  # 替换为你的仓库
    region: singapore  # 可选: singapore, oregon, frankfurt
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: employee-monitor-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@123456  # 建议修改
      - key: SCREENSHOT_DIR
        value: /data/screenshots
      - key: SCREENSHOT_RETENTION_DAYS
        value: 30
    disk:
      name: screenshots
      mountPath: /data
      sizeGB: 5
    healthCheckPath: /health

databases:
  # 注意：Render的数据库配置只是示例
  # 实际我们会使用Aiven，所以这里可以留空或删除
  - name: employee-monitor-db
    plan: free